<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found | VORTEX</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/brand-tile-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root{color-scheme:dark}
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Rajdhani',system-ui,sans-serif;color:#e9edff;min-height:100vh;
      display:grid;place-items:center;text-align:center;padding:2rem;
      background:radial-gradient(800px 400px at 80% -10%,rgba(79,124,255,.18),transparent 60%),
                 radial-gradient(700px 380px at 0% 20%,rgba(34,211,238,.14),transparent 55%),
                 #04060d;
    }
    .mark{width:88px;height:88px;margin:0 auto 1.4rem;border-radius:20px;box-shadow:0 0 0 1px rgba(148,163,255,.16),0 0 30px rgba(34,211,238,.35)}
    h1{font-family:'Orbitron',system-ui,sans-serif;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.08em;
       background:linear-gradient(135deg,#22d3ee,#4f7cff,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{font-size:1.15rem;margin:.4rem 0 .8rem;font-weight:600}
    p{color:#9aa6cc;max-width:30rem;margin:0 auto 1.8rem;font-size:1.02rem;line-height:1.6}
    a.btn{
      display:inline-block;padding:.85rem 1.8rem;border-radius:12px;text-decoration:none;
      font-family:'Orbitron',system-ui,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
      background:linear-gradient(135deg,#22d3ee,#4f7cff,#8b5cf6);color:#04121a;box-shadow:0 10px 30px -8px rgba(79,124,255,.55);
      transition:transform .2s;
    }
    a.btn:hover{transform:translateY(-2px)}
    a.alt{display:block;margin-top:1rem;color:#9aa6cc;font-size:.9rem;text-decoration:none}
    a.alt:hover{color:#22d3ee}
  </style>
</head>
<body>
  <div>
    <img class="mark" src="logo.svg" alt="VORTEX logo" onerror="this.style.display='none'">
    <h1>404</h1>
    <h2>This sector of the universe doesn't exist</h2>
    <p>The page you are looking for was moved, renamed or never published. The official VORTEX hub is one click away.</p>
    <a class="btn" href="index.html">Back to VORTEX</a>
    <a class="alt" href="marketplace.html">Browse the apps marketplace →</a>
  </div>
</body>
</html>
