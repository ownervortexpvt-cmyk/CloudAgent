<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Include system default config -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Project fonts (Bengali) -->
  <dir>/home/z/my-project/assets/fonts</dir>

  <!-- Prefer Noto Sans Bengali for Bengali script -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>bn</string></test>
    <test name="family" compare="not_contains"><string>Noto Sans Bengali</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Bengali</string></edit>
  </match>

  <!-- Cache -->
  <cachedir>/home/z/my-project/assets/fonts/cache</cachedir>
</fontconfig>
