<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen">
            <div class="container">
                <h1>Todo List</h1>
                <div class="login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <button id="loginBtn" class="btn btn-primary">Login</button>
                    </div>
                    <div class="form-group">
                        <button id="registerBtn" class="btn btn-secondary">Register New Account</button>
                    </div>
                </div>
                <div class="demo-info">
                    <h3>Demo Accounts:</h3>
                    <p><strong>Admin:</strong> username: admin, password: admin123</p>
                    <p><strong>User:</strong> username: user1, password: user123</p>
                </div>
            </div>
        </div>

        <!-- Main App Screen -->
        <div id="mainScreen" class="screen" style="display: none;">
            <div class="container">
                <div class="header">
                    <h1>My Todo List</h1>
                    <div class="user-info">
                        <span id="userWelcome">Welcome, User!</span>
                        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                    </div>
                </div>

                <div class="input-container">
                    <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off">
                    <button id="addBtn" class="btn btn-primary">Add</button>
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <div class="todo-container">
                    <ul id="todoList" class="todo-list"></ul>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path>
                            <rect x="9" y="3" width="6" height="4" rx="2"></rect>
                            <line x1="9" y1="12" x2="15" y2="12"></line>
                            <line x1="9" y1="16" x2="13" y2="16"></line>
                        </svg>
                        <p>No tasks yet. Add one above!</p>
                    </div>
                </div>

                <div class="stats">
                    <span id="totalTasks">Total: 0</span>
                    <span id="completedTasks">Completed: 0</span>
                    <span id="activeTasks">Active: 0</span>
                </div>

                <div class="actions">
                    <button id="clearCompletedBtn" class="btn btn-danger" style="display: none;">Clear All Completed</button>
                </div>
            </div>
        </div>

        <!-- Register Screen -->
        <div id="registerScreen" class="screen" style="display: none;">
            <div class="container">
                <h1>Create Account</h1>
                <div class="login-form">
                    <div class="form-group">
                        <label for="regUsername">Username:</label>
                        <input type="text" id="regUsername" placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password:</label>
                        <input type="password" id="regPassword" placeholder="Choose a password">
                    </div>
                    <div class="form-group">
                        <label for="regPasswordConfirm">Confirm Password:</label>
                        <input type="password" id="regPasswordConfirm" placeholder="Confirm password">
                    </div>
                    <div class="form-group">
                        <button id="registerSubmitBtn" class="btn btn-primary">Create Account</button>
                        <button id="cancelRegisterBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <footer>
        Built by Cloud Agent
    </footer>
</body>
</html>
