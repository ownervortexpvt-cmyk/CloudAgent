<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rakib's Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #ff6b6b;
            --accent-hover: #ff5252;
            --border: #333333;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, var(--bg-primary) 100%);
        }

        .login-form {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'Georgia', serif;
            font-size: 1rem;
            transition: var(--transition);
            border-radius: 4px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            transition: var(--transition);
            z-index: -1;
        }

        .login-btn:hover {
            color: var(--bg-primary);
            border-color: var(--accent-hover);
        }

        .login-btn:hover::before {
            left: 0;
        }

        /* Admin Dashboard */
        .admin-container {
            display: none;
            min-height: 100vh;
            background: var(--bg-primary);
        }

        .admin-header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-nav {
            display: flex;
            gap: 2rem;
        }

        .admin-nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: var(--transition);
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }

        .admin-nav button:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .admin-nav button.active {
            color: var(--accent);
            background: var(--bg-tertiary);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--danger);
            color: var(--bg-primary);
        }

        .admin-content {
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .stat-card i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 2rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 1px;
            background: var(--accent);
        }

        .table-container {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            background: var(--bg-tertiary);
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .table tr:hover {
            background: var(--bg-tertiary);
        }

        .action-btn {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            margin-right: 0.5rem;
        }

        .action-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .action-btn.delete {
            border-color: var(--danger);
            color: var(--danger);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            color: var(--bg-primary);
        }

        .add-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: var(--transition);
            margin-bottom: 2rem;
        }

        .add-btn:hover {
            background: var(--accent-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-secondary);
            margin: 5% auto;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 300;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .form-grid {
            display: grid;
            gap: 1.5rem;
        }

        .form-grid .form-group {
            margin-bottom: 0;
        }

        .form-grid textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 4px;
            border-left: 4px solid var(--success);
            transform: translateX(400px);
            transition: var(--transition);
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 1rem;
            }

            .admin-nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table-container {
                overflow-x: auto;
            }

            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <form class="login-form" id="loginForm">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminScreen" class="admin-container">
        <header class="admin-header">
            <nav class="admin-nav">
                <button class="nav-btn active" data-section="dashboard">
                    <i class="fas fa-chart-bar"></i> Dashboard
                </button>
                <button class="nav-btn" data-section="gallery">
                    <i class="fas fa-images"></i> Gallery
                </button>
                <button class="nav-btn" data-section="contacts">
                    <i class="fas fa-envelope"></i> Contacts
                </button>
                <button class="nav-btn" data-section="categories">
                    <i class="fas fa-tags"></i> Categories
                </button>
            </nav>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </header>

        <main class="admin-content">
            <!-- Dashboard Section -->
            <section id="dashboard" class="section active">
                <h2 class="section-title">Dashboard</h2>
                <div class="stats-grid" id="statsGrid">
                    <!-- Stats will be populated by JavaScript -->
                </div>
            </section>

            <!-- Gallery Section -->
            <section id="gallery" class="section">
                <h2 class="section-title">Gallery Management</h2>
                <button class="add-btn" id="addGalleryBtn">
                    <i class="fas fa-plus"></i> Add Photo
                </button>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Featured</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="galleryTableBody">
                            <!-- Gallery items will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Contacts Section -->
            <section id="contacts" class="section">
                <h2 class="section-title">Contact Messages</h2>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contactsTableBody">
                            <!-- Contacts will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Categories Section -->
            <section id="categories" class="section">
                <h2 class="section-title">Categories</h2>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTableBody">
                            <!-- Categories will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Gallery Modal -->
    <div id="galleryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="galleryModalTitle">Add Photo</h3>
                <button class="close-btn" onclick="closeModal('galleryModal')">&times;</button>
            </div>
            <form id="galleryForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="galleryTitle">Title</label>
                        <input type="text" id="galleryTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="galleryDescription">Description</label>
                        <textarea id="galleryDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="galleryImage">Image URL</label>
                        <input type="url" id="galleryImage" required>
                    </div>
                    <div class="form-group">
                        <label for="galleryCategory">Category</label>
                        <select id="galleryCategory" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="galleryFeatured">Featured</label>
                        <input type="checkbox" id="galleryFeatured">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('galleryModal')">Cancel</button>
                    <button type="submit" class="add-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        // API Base URL
        const API_BASE = '/api';
        let currentEditingId = null;

        // Check if logged in
        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                showAdminScreen();
            } else {
                showLoginScreen();
            }
        }

        // Show login screen
        function showLoginScreen() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminScreen').style.display = 'none';
        }

        // Show admin screen
        function showAdminScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
            loadDashboard();
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('adminToken', 'token');
                    showAdminScreen();
                } else {
                    showToast('Invalid password', 'error');
                }
            } catch (error) {
                showToast('Login failed', 'error');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            showLoginScreen();
        });

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const section = btn.dataset.section;
                
                // Update active nav button
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Show active section
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(section).classList.add('active');
                
                // Load section data
                if (section === 'dashboard') loadDashboard();
                else if (section === 'gallery') loadGallery();
                else if (section === 'contacts') loadContacts();
                else if (section === 'categories') loadCategories();
            });
        });

        // Load dashboard stats
        async function loadDashboard() {
            try {
                const [statsResponse, galleryResponse, contactsResponse] = await Promise.all([
                    fetch(`${API_BASE}/stats`),
                    fetch(`${API_BASE}/gallery`),
                    fetch(`${API_BASE}/contacts`)
                ]);
                
                const stats = await statsResponse.json();
                const gallery = await galleryResponse.json();
                const contacts = await contactsResponse.json();
                
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <i class="fas fa-camera"></i>
                        <h3>${stats.totalPhotos}</h3>
                        <p>Total Photos</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-star"></i>
                        <h3>${stats.featuredPhotos}</h3>
                        <p>Featured Photos</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-envelope"></i>
                        <h3>${stats.totalContacts}</h3>
                        <p>Contact Messages</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-tags"></i>
                        <h3>${stats.categories}</h3>
                        <p>Categories</p>
                    </div>
                `;
            } catch (error) {
                showToast('Failed to load dashboard', 'error');
            }
        }

        // Load gallery
        async function loadGallery() {
            try {
                const response = await fetch(`${API_BASE}/gallery`);
                const gallery = await response.json();
                
                const tbody = document.getElementById('galleryTableBody');
                tbody.innerHTML = gallery.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.title}</td>
                        <td>${item.category}</td>
                        <td>${item.featured ? '<i class="fas fa-star" style="color: #ff6b6b;"></i>' : ''}</td>
                        <td>${item.date}</td>
                        <td>
                            <button class="action-btn" onclick="editGallery(${item.id})">Edit</button>
                            <button class="action-btn delete" onclick="deleteGallery(${item.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast('Failed to load gallery', 'error');
            }
        }

        // Load contacts
        async function loadContacts() {
            try {
                const response = await fetch(`${API_BASE}/contacts`);
                const contacts = await response.json();
                
                const tbody = document.getElementById('contactsTableBody');
                tbody.innerHTML = contacts.map(contact => `
                    <tr>
                        <td>${contact.id}</td>
                        <td>${contact.name}</td>
                        <td>${contact.email}</td>
                        <td><span style="color: ${contact.status === 'new' ? '#ff6b6b' : '#4caf50'}">${contact.status}</span></td>
                        <td>${contact.date}</td>
                        <td>
                            <button class="action-btn" onclick="viewContact(${contact.id})">View</button>
                            <button class="action-btn delete" onclick="deleteContact(${contact.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast('Failed to load contacts', 'error');
            }
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const categories = await response.json();
                
                const tbody = document.getElementById('categoriesTableBody');
                tbody.innerHTML = categories.map(category => `
                    <tr>
                        <td>${category.id}</td>
                        <td>${category.name}</td>
                        <td>${category.description}</td>
                        <td>
                            <button class="action-btn" onclick="editCategory(${category.id})">Edit</button>
                            <button class="action-btn delete" onclick="deleteCategory(${category.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast('Failed to load categories', 'error');
            }
        }

        // Gallery modal
        document.getElementById('addGalleryBtn').addEventListener('click', () => {
            currentEditingId = null;
            document.getElementById('galleryModalTitle').textContent = 'Add Photo';
            document.getElementById('galleryForm').reset();
            loadCategoriesForSelect();
            document.getElementById('galleryModal').style.display = 'block';
        });

        // Gallery form submission
        document.getElementById('galleryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('galleryTitle').value,
                description: document.getElementById('galleryDescription').value,
                image: document.getElementById('galleryImage').value,
                category: document.getElementById('galleryCategory').value,
                featured: document.getElementById('galleryFeatured').checked
            };
            
            try {
                const url = currentEditingId ? 
                    `${API_BASE}/gallery/${currentEditingId}` : 
                    `${API_BASE}/gallery`;
                
                const method = currentEditingId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    closeModal('galleryModal');
                    showToast('Photo saved successfully');
                    loadGallery();
                } else {
                    showToast('Failed to save photo', 'error');
                }
            } catch (error) {
                showToast('Failed to save photo', 'error');
            }
        });

        // Load categories for select
        async function loadCategoriesForSelect() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const categories = await response.json();
                
                const select = document.getElementById('galleryCategory');
                select.innerHTML = '<option value="">Select Category</option>' + 
                    categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('');
            } catch (error) {
                showToast('Failed to load categories', 'error');
            }
        }

        // Edit gallery item
        async function editGallery(id) {
            try {
                const response = await fetch(`${API_BASE}/gallery/${id}`);
                const item = await response.json();
                
                currentEditingId = id;
                document.getElementById('galleryModalTitle').textContent = 'Edit Photo';
                document.getElementById('galleryTitle').value = item.title;
                document.getElementById('galleryDescription').value = item.description;
                document.getElementById('galleryImage').value = item.image;
                document.getElementById('galleryFeatured').checked = item.featured;
                
                await loadCategoriesForSelect();
                document.getElementById('galleryCategory').value = item.category;
                
                document.getElementById('galleryModal').style.display = 'block';
            } catch (error) {
                showToast('Failed to load photo', 'error');
            }
        }

        // Delete gallery item
        async function deleteGallery(id) {
            if (confirm('Are you sure you want to delete this photo?')) {
                try {
                    const response = await fetch(`${API_BASE}/gallery/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showToast('Photo deleted successfully');
                        loadGallery();
                    } else {
                        showToast('Failed to delete photo', 'error');
                    }
                } catch (error) {
                    showToast('Failed to delete photo', 'error');
                }
            }
        }

        // View contact
        async function viewContact(id) {
            try {
                const response = await fetch(`${API_BASE}/contacts/${id}`);
                const contact = await response.json();
                
                alert(`Name: ${contact.name}\nEmail: ${contact.email}\nMessage: ${contact.message}\nDate: ${contact.date}`);
            } catch (error) {
                showToast('Failed to load contact', 'error');
            }
        }

        // Delete contact
        async function deleteContact(id) {
            if (confirm('Are you sure you want to delete this contact?')) {
                try {
                    const response = await fetch(`${API_BASE}/contacts/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showToast('Contact deleted successfully');
                        loadContacts();
                    } else {
                        showToast('Failed to delete contact', 'error');
                    }
                } catch (error) {
                    showToast('Failed to delete contact', 'error');
                }
            }
        }

        function editCategory(id) {

        }

        // Delete category
        function deleteCategory(id) {
            if (confirm('Are you sure you want to delete this category?')) {
                showToast('Category deletion not implemented yet', 'error');
            }
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize
        checkAuth();
    </script>
